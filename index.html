<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecyPaper – منصة تثمين النفايات الورقية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g1:#1c5b3b;--g2:#2f9e5f;--g3:#e3f1e8;--bg:#edf5ef;--card:#fff;--tx:#17301f;--mu:#6a7f71;--bd:#dbe7de;--btx:#fff;--im:#f4faf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2f8f5b;--g2:#4cc27f;--g3:#1a3526;--bg:#0e1a13;--card:#15251b;--tx:#e8f3ec;--mu:#9bb0a2;--bd:#26402f;--im:#e9f3ec}}
:root[data-theme="dark"]{--g1:#2f8f5b;--g2:#4cc27f;--g3:#1a3526;--bg:#0e1a13;--card:#15251b;--tx:#e8f3ec;--mu:#9bb0a2;--bd:#26402f;--im:#e9f3ec}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
button,input,select{font:inherit;color:inherit}
.bg{background:linear-gradient(135deg,var(--bg),var(--card) 60%,var(--g3));min-height:100vh}
.btn{background:var(--g1);color:var(--btx);border:0;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 10px #0a3a1a0d}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;color:var(--g1);font-weight:800;font-size:22px;line-height:1.1}
.logo small{display:block;font-size:9px;font-weight:500;color:var(--mu)}
.logo svg{width:38px;height:38px}
.top{direction:ltr;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;gap:12px}
.top nav{display:flex;gap:26px;direction:rtl;font-size:14px}.top nav a{cursor:pointer;color:var(--tx)}
.top .btn{padding:9px 20px;border-radius:30px;font-size:14px}
.hero{direction:ltr;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;max-width:1050px;margin:10px auto 0;padding:0 5%}
.ht{direction:rtl;text-align:right}
.ht h1{font-size:31px;line-height:1.5;font-weight:800;color:var(--g1)}
.ht p{color:var(--mu);margin:14px 0 22px}
.hi{border-radius:22px;overflow:hidden;background:var(--im);box-shadow:0 10px 40px #0a3a1a22}
.hi img,.gl img{width:100%;display:block}
.roles{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.role{direction:ltr;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;cursor:pointer;box-shadow:0 2px 10px #0a3a1a12;text-align:right}
.role .ic{width:46px;height:46px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:22px;flex:none}
.role div{direction:rtl;flex:1;line-height:1.3}.role small{color:var(--mu);font-size:12px;display:block}
.sec{max-width:1050px;margin:50px auto 0;padding:0 5%;text-align:center}
.sec h3{font-size:22px;color:var(--g1);margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fg .card .ic{width:56px;height:56px;border-radius:50%;background:var(--g1);margin:0 auto 8px;display:grid;place-items:center;font-size:26px}
.band{background:var(--g1);color:#fff;border-radius:14px;padding:14px;margin:22px 0 0;font-weight:700}
.foot{text-align:center;color:var(--mu);padding:30px 0 40px;font-size:14px}
.lw{direction:ltr;display:grid;grid-template-columns:1fr 1fr;max-width:900px;margin:30px auto;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 10px 40px #0a3a1a22;border:1px solid var(--bd)}
.gl{background:var(--im);display:grid;place-items:center;text-align:center;padding:20px;color:#1c5b3b}
.gl h3{font-size:20px;margin-top:8px}.gl p{color:#4c8a67;font-size:14px}
.lf{direction:rtl;padding:26px 28px}
.lf h2{text-align:center;margin:12px 0 16px;font-size:22px}
.tabs{direction:ltr;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer}
.tabs .on{background:var(--g1);color:var(--btx)}
.inp{position:relative;margin-bottom:12px}
.inp input,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.inp span{position:absolute;left:12px;top:11px;opacity:.6}
label.l{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
.lnk{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--g1);cursor:pointer}
.app{direction:ltr;display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:var(--g1);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .logo{color:#fff;margin-bottom:20px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;opacity:.92}
.side a.on{background:#ffffff2b;font-weight:700;opacity:1}
.side .sp{flex:1}
.main{direction:rtl;padding:0 22px 26px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--bd);margin-bottom:18px;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--g3);display:grid;place-items:center;font-size:18px}
.main h2{font-size:22px;font-weight:800}.sub{color:var(--g1);font-weight:500;margin-bottom:16px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st .ic{width:50px;height:50px;border-radius:50%;background:var(--g3);display:grid;place-items:center;font-size:24px;flex:none}
.st span{font-size:13px;font-weight:500}.st b{display:block;font-size:26px;line-height:1.3}
.st em{font-style:normal;font-size:12px;color:var(--g2)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:300px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#dff3e6;color:#1b7a45}
.bd:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.bd.w{background:#fff0cc;color:#9a6a00}.bd.n{background:#e1eaff;color:#2b4fa0}
.cta{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.cta img{width:100%;display:block;background:var(--im)}
.cta .btn{margin:0 12px 12px;padding:16px;font-size:16px}
.ch{display:flex;direction:ltr;height:170px;gap:8px;margin-top:8px}
.ya{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mu);padding-bottom:20px}
.bars{flex:1;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--bd);position:relative;margin-bottom:20px;background:repeating-linear-gradient(transparent 0 38px,var(--bd) 38px 39px)}
.bars div{flex:1;background:var(--g2);border-radius:5px 5px 0 0;position:relative}
.bars u{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:11px;text-decoration:none;color:var(--mu)}
.fm{max-width:520px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g1);color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:9}
.btn.alt{background:var(--g3);color:var(--g1);padding:6px 14px}.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%}#qrbox{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;margin:12px 0}.md p{font-size:14px;color:var(--mu)}
@media (max-width:780px){
.hero,.lw{grid-template-columns:1fr}.hero .hi{order:-1}.top nav{display:none}.ht h1{font-size:24px}.gl{padding:10px}
.app{display:block}.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.side .logo,.side .sp{display:none}.side a{white-space:nowrap;flex:none}.two{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
</style>
</head>
